# Produces real CI failures on demand for the assistant to diagnose.
# Every job here is expected to fail (the flaky one about half the time).
name: Sandbox failures

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Which sandbox project to run (see sandbox-repos/scenarios.json)
        type: choice
        default: all
        options:
          - all
          - java-compile-error
          - java-test-failure
          - java-missing-dependency
          - node-test-failure
          - node-flaky-test
          - python-test-failure
          - docker-build-failure
          - job-timeout

permissions:
  contents: read

jobs:
  plan:
    name: Pick scenarios
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          matrix=$(jq -c --arg s "$SCENARIO" '[.[] | select($s == "all" or .id == $s)]' sandbox-repos/scenarios.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.scenario.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.scenario.timeoutMinutes || 10 }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: sandbox-repos/${{ matrix.scenario.id }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.scenario.toolchain == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.scenario.toolchain == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - if: matrix.scenario.toolchain == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and test
        run: ${{ matrix.scenario.command }}
