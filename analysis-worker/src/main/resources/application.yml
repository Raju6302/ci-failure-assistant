spring:
  application:
    name: analysis-worker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cifa}
    username: ${DATABASE_USER:cifa}
    password: ${DATABASE_PASSWORD:cifa}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

cifa:
  github:
    token: ${GITHUB_TOKEN:}
    app:
      id: ${GITHUB_APP_ID:}
      private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
  ingestion:
    max-attempts: 3
    reclaim-idle: PT2M
    reclaim-interval: PT1M
