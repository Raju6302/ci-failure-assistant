spring:
  application:
    name: analysis-worker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cifa}
    username: ${DATABASE_USER:cifa}
    password: ${DATABASE_PASSWORD:cifa}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

cifa:
  github:
    token: ${GITHUB_TOKEN:}
    app:
      id: ${GITHUB_APP_ID:}
      private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
  ingestion:
    max-attempts: 3
    reclaim-idle: PT2M
    reclaim-interval: PT1M
  diagnosis:
    # Claude credentials come from ANTHROPIC_API_KEY. Without them, diagnoses fall back to rules.
    agent-enabled: ${DIAGNOSIS_AGENT_ENABLED:true}
    model: ${DIAGNOSIS_MODEL:claude-opus-5-5}
    effort: high
    max-steps: 15
    token-budget: 400000
    mcp:
      url: ${MCP_URL:http://localhost:8082/mcp}
      auth-token: ${MCP_AUTH_TOKEN:}
  rag:
    enabled: ${RAG_ENABLED:true}
    embedder: ${RAG_EMBEDDER:onnx}
    model-cache-dir: ${RAG_MODEL_CACHE_DIR:${java.io.tmpdir}/cifa-models}
