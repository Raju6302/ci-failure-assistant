spring:
  application:
    name: api-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cifa}
    username: ${DATABASE_USER:cifa}
    password: ${DATABASE_PASSWORD:cifa}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

cifa:
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:}
  relay:
    # How often to look for runs that never reached the queue, and how old they must be.
    interval: PT30S
    min-age: PT30S
